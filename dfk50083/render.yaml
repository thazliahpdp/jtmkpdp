services:
  - type: web
    name: dfk50083-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./dfk50083.db
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false          # you will fill this in Render dashboard
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: UPLOAD_DIR
        value: uploads
